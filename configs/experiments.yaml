# Experiment settings for PromptEnergy-Bench

primary_exp_gsm8k:
  description: "Standard Prompting vs Few-Shot vs Chain-of-Thought on GSM8K"
  dataset:
    name: "gsm8k"
    evaluation_split: "test"
    context_source_split: "train"
  strategies:
    - "zero_shot_direct"
    - "few_shot_3"
    - "zero_shot_cot"
    - "short_cot"
    - "long_cot"
  defaults:
    warmups: 3
    repetitions: 3
    eval_size: "full"
  validation:
    warmups: 1
    repetitions: 1
    eval_size: 50

context_scaling_gsm8k:
  description: "Controlled Context Scaling using GSM8K Train Examples"
  dataset:
    name: "gsm8k"
    evaluation_split: "test"
    context_source_split: "train"
  context_sizes:
    - 512
    - 1024
    - 2048
    - 4096
    - 8192
  context_types:
    - "relevant"
    - "distractor"
  defaults:
    warmups: 3
    repetitions: 3
    eval_size: "full"
  validation:
    warmups: 1
    repetitions: 1
    eval_size: 50

rag_gsm8k:
  description: "BM25 Retrieval Augmented Generation on GSM8K (Optional Extension)"
  dataset:
    name: "gsm8k"
    evaluation_split: "test"
    corpus_split: "train"
  retrievers:
    - "bm25"
  top_k_values:
    - 1
    - 3
    - 5
  defaults:
    warmups: 3
    repetitions: 3
    eval_size: "full"
  validation:
    warmups: 1
    repetitions: 1
    eval_size: 50
