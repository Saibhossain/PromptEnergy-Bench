# Model configurations for PromptEnergy-Bench
# Defines available models, their backend operators, supported formats, context limits, and reasoning attributes.

models:
  - name: "qwen3.5:0.8b-mlx"
    backend: "ollama"
    format: "mlx"
    context_limit: 4096
    supports_thinking: true
    default_parameters:
      temperature: 0.0
      seed: 42
      max_tokens: 1024

